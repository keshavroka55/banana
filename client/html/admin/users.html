<!-- html/admin/users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Users | Banana Game</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/admin/users.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="../../index.html">🍌 Banana Game</a>
            <nav id="app-nav" class="app-nav"></nav>
        </div>
    </header>

    <main class="container">
        <div class="users-header">
            <h1 class="page-title">Users</h1>
            <button id="create-user-btn" class="btn btn-primary" type="button">
                + Create User
            </button>
        </div>

        <div id="page-error" class="alert alert-error" hidden></div>

        <section class="card">
            <p id="users-status" class="muted">Loading users…</p>

            <div class="table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Create / Edit modal ----------------------------------------- -->
    <div id="user-modal" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Create User</h2>
                <button id="modal-close" class="modal-close" type="button" aria-label="Close">×</button>
            </div>

            <div id="modal-error" class="alert alert-error" hidden></div>

            <form id="user-form" class="modal-form" novalidate>
                <input type="hidden" id="user-id" />

                <label for="user-name">Name</label>
                <input id="user-name" type="text" required />

                <label for="user-email">Email</label>
                <input id="user-email" type="email" required />

                <label for="user-password">
                    Password
                    <span id="password-hint" class="field-hint">(leave blank to keep current)</span>
                </label>
                <input id="user-password" type="password" autocomplete="new-password" />

                <label for="user-role">Role</label>
                <select id="user-role">
                    <option value="player">player</option>
                    <option value="admin">admin</option>
                </select>

                <label for="user-bio">Bio <span class="field-hint">(optional)</span></label>
                <textarea id="user-bio" rows="2"></textarea>

                <label for="user-avatar">Avatar URL <span class="field-hint">(optional)</span></label>
                <input id="user-avatar" type="url" placeholder="https://…" />

                <div class="modal-actions">
                    <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
                    <button type="submit" id="modal-submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/admin/users.js"></script>
</body>
</html>
