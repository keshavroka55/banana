<!-- html/auth/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Banana Game</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="../../index.html">🍌 Banana Game</a>
            <nav id="app-nav" class="app-nav"></nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Create account</h1>
            <p class="auth-subtitle">Register to save your game history.</p>

            <div id="form-error" class="alert alert-error" hidden></div>
            <div id="form-success" class="alert alert-success" hidden></div>

            <form id="register-form" novalidate>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required />

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required />

                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />

                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="./login.html">Login</a>
            </p>
        </section>
    </main>

    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/auth/auth.js"></script>
</body>
</html>
