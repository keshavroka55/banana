<!-- html/auth/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Banana Game</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="../../index.html">🍌 Banana Game</a>
            <nav id="app-nav" class="app-nav"></nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Login</h1>
            <p class="auth-subtitle">Welcome back! Log in to save your scores.</p>

            <div id="form-error" class="alert alert-error" hidden></div>
            <div id="form-success" class="alert alert-success" hidden></div>

            <form id="login-form" novalidate>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="./register.html">Register</a>
            </p>

            <div class="auth-divider"><span>or</span></div>
            <a id="google-login" class="btn btn-ghost btn-block" href="/api/auth/google">Continue with Google</a>
        </section>
    </main>

    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/auth/auth.js"></script>
</body>
</html>
