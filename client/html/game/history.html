<!-- html/game/history.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game History | Banana Game</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/game/history.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="../../index.html">🍌 Banana Game</a>
            <nav id="app-nav" class="app-nav"></nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Game History</h1>

        <section class="card">
            <p id="history-status" class="muted">Loading your games…</p>

            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Score</th>
                            <th>Correct</th>
                            <th>Wrong</th>
                            <th>Completed</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/game/history.js"></script>
</body>
</html>
